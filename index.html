<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Harmony Trainer v6.0</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-cyan: #22d3ee;
            --accent-gold: #fbbf24;
            --accent-purple: #a855f7;
            --text-main: #ffffff;
            --text-dim: #6b7280;
            --btn-bg: #2d2d2d;
            --btn-border: #404040;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100vh;
            justify-content: center;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }
        .stat-value { color: white; font-weight: bold; }
        .stat-progress { color: var(--accent-cyan); font-weight: bold; }

        /* CONTROLS */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 5px;
        }

        .switcher {
            display: flex;
            background: #000;
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--btn-border);
        }

        .switcher-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 8px 0;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .switcher-btn.active { background-color: var(--btn-bg); color: var(--accent-cyan); }
        .switcher-btn.active-gold { background-color: var(--btn-bg); color: var(--accent-gold); }
        .switcher-btn.active-purple { background-color: var(--btn-bg); color: var(--accent-purple); }

        /* DISPLAY PANEL */
        .device-panel {
            background: radial-gradient(circle at top left, #2a2a2a, #1a1a1a);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .led {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #333;
            transition: all 0.2s;
        }
        .led.on-green { background-color: var(--success); box-shadow: 0 0 10px var(--success); }
        .led.on-red { background-color: var(--error); box-shadow: 0 0 10px var(--error); }

        .screen-label { font-size: 10px; text-transform: uppercase; color: #555; letter-spacing: 1px; margin-bottom: 8px; }
        .key-display { font-size: 42px; font-weight: bold; line-height: 1; transition: color 0.3s; }
        .sub-label { font-size: 13px; color: #888; margin-top: 12px; font-style: italic; }

        /* BUTTONS */
        .btn-grid { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .btn-grid.grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; }

        .chord-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-bottom: 4px solid var(--btn-border);
            border-radius: 10px;
            padding: 15px;
            color: #eee;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.05s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chord-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .chord-btn.correct { background-color: var(--success); border-color: #166534; color: white; }
        .chord-btn.wrong { background-color: var(--error); border-color: #991b1b; color: white; }
        
        .grid-2x2 .chord-btn { font-size: 22px; color: var(--accent-gold); }
        .arrow { color: #555; margin: 0 5px; font-size: 12px; }

        /* RESULTS */
        .results-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .results-overlay.visible { display: flex; }
        .result-score { font-size: 70px; color: var(--accent-gold); font-weight: bold; }
        .restart-btn { background: var(--accent-cyan); border: none; padding: 18px 45px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; }

        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app">
        <div id="resultsScreen" class="results-overlay">
            <div style="color: #666; letter-spacing: 2px;">SESSION COMPLETE</div>
            <div id="finalScore" class="result-score">0</div>
            <div style="color: #444; margin-top: -10px; margin-bottom: 20px;">POINTS</div>
            <button class="restart-btn" onclick="restartGame()">New Round</button>
        </div>

        <div class="header">
            <div>HARMONY UNIT <span style="color:#444">v6.0</span></div>
            <div>SCORE <span id="scoreVal" class="stat-value">0</span> | QUIZ <span id="progressVal" class="stat-progress">1/30</span></div>
        </div>

        <div class="controls-area">
            <div class="switcher">
                <button class="switcher-btn active" id="btnMaj" onclick="setMode('maj')">MAJOR</button>
                <button class="switcher-btn" id="btnMin" onclick="setMode('min')">MINOR</button>
                <button class="switcher-btn" id="btnMix" onclick="setMode('mix')">MIXED</button>
            </div>
            <div class="switcher">
                <button class="switcher-btn active" id="btnTypeFull" onclick="setType('full')">II-V-I SEQ</button>
                <button class="switcher-btn" id="btnTypeV" onclick="setType('v_only')">V DEGREE</button>
            </div>
            <div class="switcher hidden" id="directionSwitcher">
                <button class="switcher-btn active-purple" id="btnDirNormal" onclick="setDirection('normal')">I ➝ FIND V</button>
                <button class="switcher-btn" id="btnDirReverse" onclick="setDirection('reverse')">V ➝ FIND I</button>
            </div>
        </div>

        <div id="devicePanel" class="device-panel">
            <div id="statusLed" class="led"></div>
            <span class="screen-label" id="topLabel">Target Key</span>
            <div id="keyDisplay" class="key-display">C Major</div>
            <div id="subLabel" class="sub-label">Find the V Degree</div>
        </div>

        <div id="optionsGrid" class="btn-grid"></div>
    </div>

    <script>
        const musicData = {
            "C":  { maj: ["Dm7", "G7", "Cmaj7"], min: ["Dm7b5", "G7b9", "CmMaj7"] },
            "F":  { maj: ["Gm7", "C7", "Fmaj7"], min: ["Gm7b5", "C7b9", "FmMaj7"] },
            "Bb": { maj: ["Cm7", "F7", "Bbmaj7"], min: ["Cm7b5", "F7b9", "BbmMaj7"] },
            "Eb": { maj: ["Fm7", "Bb7", "Ebmaj7"], min: ["Fm7b5", "Bb7b9", "EbmMaj7"] },
            "Ab": { maj: ["Bbm7", "Eb7", "Abmaj7"], min: ["Bbm7b5", "Eb7b9", "AbmMaj7"] },
            "Db": { maj: ["Ebm7", "Ab7", "Dbmaj7"], min: ["Ebm7b5", "Ab7b9", "DbmMaj7"] },
            "Gb": { maj: ["Abm7", "Db7", "Gbmaj7"], min: ["Abm7b5", "Db7b9", "GbmMaj7"] },
            "B":  { maj: ["C#m7", "F#7", "Bmaj7"],  min: ["C#m7b5", "F#7b9", "BmMaj7"] },
            "E":  { maj: ["F#m7", "B7", "Emaj7"],   min: ["F#m7b5", "B7b9", "EmMaj7"] },
            "A":  { maj: ["Bm7", "E7", "Amaj7"],    min: ["Bm7b5", "E7b9", "AmMaj7"] },
            "D":  { maj: ["Em7", "A7", "Dmaj7"],    min: ["Em7b5", "A7b9", "DmMaj7"] },
            "G":  { maj: ["Am7", "D7", "Gmaj7"],    min: ["Am7b5", "D7b9", "GmMaj7"] }
        };

        const keys = Object.keys(musicData);
        let score = 0, questionCount = 1, currentMode = 'maj', currentType = 'full', currentDirection = 'normal', currentCorrectAnswer = null, isInputLocked = false;

        const ui = {
            score: document.getElementById('scoreVal'),
            progress: document.getElementById('progressVal'),
            key: document.getElementById('keyDisplay'),
            top: document.getElementById('topLabel'),
            sub: document.getElementById('subLabel'),
            grid: document.getElementById('optionsGrid'),
            led: document.getElementById('statusLed'),
            results: document.getElementById('resultsScreen'),
            dirSwitcher: document.getElementById('directionSwitcher'),
            panel: document.getElementById('devicePanel')
        };

        function setMode(m) { currentMode = m; updateUIButtons(); restartGame(); }
        function setType(t) { 
            currentType = t; 
            ui.dirSwitcher.classList.toggle('hidden', t !== 'v_only');
            updateUIButtons(); 
            restartGame(); 
        }
        function setDirection(d) { currentDirection = d; updateUIButtons(); restartGame(); }

        function updateUIButtons() {
            // Reset active states
            document.querySelectorAll('.switcher-btn').forEach(b => b.classList.remove('active', 'active-gold', 'active-purple'));
            
            // Mode
            document.getElementById('btn' + currentMode.charAt(0).toUpperCase() + currentMode.slice(1)).classList.add('active');
            // Type
            if(currentType === 'full') document.getElementById('btnTypeFull').classList.add('active');
            else document.getElementById('btnTypeV').classList.add('active-gold');
            // Direction
            if(currentDirection === 'normal') document.getElementById('btnDirNormal').classList.add('active-purple');
            else document.getElementById('btnDirReverse').classList.add('active-purple');
        }

        function restartGame() {
            score = 0; questionCount = 1;
            ui.results.classList.remove('visible');
            nextQuestion();
        }

        function nextQuestion() {
            if (questionCount > 30) { ui.results.classList.add('visible'); document.getElementById('finalScore').textContent = score; return; }
            isInputLocked = false;
            ui.led.className = 'led';
            ui.panel.classList.remove('shake');

            let roundMode = currentMode === 'mix' ? (Math.random() > 0.5 ? 'maj' : 'min') : currentMode;
            const rKeyName = keys[Math.floor(Math.random() * keys.length)];
            const correctArr = musicData[rKeyName][roundMode];
            
            let options = [];
            ui.grid.innerHTML = '';

            if (currentType === 'full') {
                ui.grid.className = 'btn-grid';
                ui.top.textContent = "Sequence for:";
                ui.key.style.color = "var(--accent-cyan)";
                ui.key.innerHTML = `${rKeyName} <span style="font-size:14px; vertical-align:middle; color:#6b7280">${roundMode.toUpperCase()}</span>`;
                ui.sub.textContent = "Find the II - V - I";
                
                currentCorrectAnswer = correctArr.join(' - ');
                options.push({raw: currentCorrectAnswer, html: correctArr.join(' <span class="arrow">➝</span> ')});
                
                while(options.length < 4) {
                    let rK = keys[Math.floor(Math.random()*12)], rM = Math.random()>0.5?'maj':'min';
                    let wArr = musicData[rK][rM];
                    let wStr = wArr.join(' - ');
                    if(!options.some(o=>o.raw===wStr)) options.push({raw: wStr, html: wArr.join(' <span class="arrow">➝</span> ')});
                }
            } else {
                ui.grid.className = 'btn-grid grid-2x2';
                if (currentDirection === 'normal') {
                    ui.top.textContent = "Target Key:";
                    ui.key.style.color = "var(--accent-cyan)";
                    ui.key.innerHTML = `${rKeyName} <span style="font-size:14px; vertical-align:middle; color:#6b7280">${roundMode.toUpperCase()}</span>`;
                    ui.sub.textContent = "Identify the Dominant (V)";
                    currentCorrectAnswer = correctArr[1];
                } else {
                    ui.top.textContent = "Dominant Chord:";
                    ui.key.style.color = "var(--accent-gold)";
                    ui.key.textContent = correctArr[1];
                    ui.sub.textContent = `Resolves to (${roundMode.toUpperCase()})?`;
                    currentCorrectAnswer = correctArr[2]; // I Grado
                }
                
                options.push({raw: currentCorrectAnswer, html: currentCorrectAnswer});
                while(options.length < 4) {
                    let rK = keys[Math.floor(Math.random()*12)];
                    let wChord = musicData[rK][roundMode][currentDirection === 'normal' ? 1 : 2];
                    if(!options.some(o=>o.raw===wChord)) options.push({raw: wChord, html: wChord});
                }
            }

            options.sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'chord-btn';
                btn.innerHTML = opt.html;
                btn.onclick = () => handleAnswer(btn, opt.raw);
                ui.grid.appendChild(btn);
            });
            
            ui.score.textContent = score;
            ui.progress.textContent = `${questionCount}/30`;
        }

        function handleAnswer(btn, sel) {
            if(isInputLocked) return;
            isInputLocked = true;
            
            const isCorrect = (sel === currentCorrectAnswer);
            if(isCorrect) {
                btn.classList.add('correct'); ui.led.classList.add('on-green'); score += 10;
            } else {
                btn.classList.add('wrong'); ui.led.classList.add('on-red'); ui.panel.classList.add('shake');
                Array.from(ui.grid.children).forEach(b => {
                    if(b.innerHTML.replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim() === currentCorrectAnswer.replace(/-/g, "").replace(/\s+/g, " ").trim() || b.innerHTML.includes(currentCorrectAnswer)) {
                         b.classList.add('correct');
                    }
                });
            }
            setTimeout(() => { questionCount++; nextQuestion(); }, 1200);
        }

        updateUIButtons();
        restartGame();
    </script>
</body>
</html>
